<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <link rel="stylesheet" href="./pages/index.css" />
    <script src="index.js" type="module" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Serif:ital@0;1&display=swap"
    rel="stylesheet"
    />
    <title>Exercise DOM API</title>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <nav class="nav">
          <ul class="nav__links">
            <li><a class="nav__link" href="#recipes">Elemento 1</a></li>
            <li>
              <a class="nav__link" href="#reservation">Elemento 2</a>
            </li>
            <li><a class="nav__link" href="#menu">Elemento 3</a></li>
            <li><a class="nav__link" href="#contact">Elemento 4</a></li>
          </ul>
        </nav>
      </header>

      <main id="container" class="container">
        <section class="todo">
          <h2 class="todo__title">Lista de Tareas</h2>
          <div class="todo__input-container">
            <input type="text" class="todo__input" placeholder="Nueva tarea...">
            <button class="todo__add-button">Agregar</button>
          </div>
          
          <div class="todo__lists">
            <div class="todo__pending">
              <h3 class="todo__subtitle">Tareas Pendientes</h3>
              <ul class="todo__list" id="pendingTasks">
              </ul>
            </div>
            
            <div class="todo__completed">
              <h3 class="todo__subtitle">Tareas Completadas</h3>
              <ul class="todo__list" id="completedTasks">
              </ul>
            </div>
          </div>
        </section>
      </main>

      <footer class="footer">
        <div class="footer__content">
          <div class="footer__social">
            <h3 class="footer__social-heading">Redes sociales</h3>
            <ul class="footer__list">
              <li class="footer__list-item">
                <a href="https://facebook.com/evert.morenoserrate.5" class="footer__social-link"
                  ><img
                    src="./images/facebook_white.svg"
                    alt="Logo Facebook"
                    class="footer__social-icon"
                  />
                  Facebook</a
                >
              </li>
              <li class="footer__list-item">
                <img
                  src="./images/instagram_white.svg"
                  alt="Logo Instagram"
                  class="footer__social-icon"
                />
                <a href="#" class="footer__social-link"> Instagram</a>
              </li>
            </ul>
          </div>
        </div>
        <div class="footer__copyright">&copy; 2025 Evert Moreno</div>
      </footer>
    </div>
    <template id="card__template">
      <article class="card">
        <h3 class="card__title"></h3>
        <div class="card__body">
          <div class='card__body__image'></div>
          <section class='card__body__content'>
          </section>
        </div>
        </article>
    </template>
  </body>
</html>
